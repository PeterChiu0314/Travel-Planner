# Travel Studio: non-blocking cross-workspace regression
# No remote Supabase or Vercel credentials are used. Vercel deploys independently.
name: Travel Studio QA

on:
  push:
    branches:
      - "codex/**"
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      suite:
        description: "Regression coverage"
        required: true
        type: choice
        default: core
        options:
          - core
          - extended

permissions:
  contents: read

concurrency:
  group: travel-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      PLAYWRIGHT_BASE_URL: "http://127.0.0.1:5173"
      TEST_SUITE: ${{ github.event.inputs.suite || 'core' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked app dependencies
        run: npm ci
      - name: Install isolated PostgreSQL WASM (CI only)
        shell: bash
        run: |
          # Existing formal App tests import PGlite through this external path.
          npm install --no-save --package-lock=false --ignore-scripts @electric-sql/pglite@0.5.15
          echo "PGLITE_MODULE=$(node -p 'require.resolve("@electric-sql/pglite")')" >> "$GITHUB_ENV"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Production build
        run: npm run build
      - name: Cross-workspace Playwright regression
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --port 5173 --strictPort > "$RUNNER_TEMP/vite.log" 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS "$PLAYWRIGHT_BASE_URL" >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          if [[ "$ready" -ne 1 ]]; then
            cat "$RUNNER_TEMP/vite.log"
            exit 1
          fi

          # Core: curated behavior-based coverage, shared between local and CI.
          # Extended: wider existing suites, used ahead of major merges.
          if [[ "$TEST_SUITE" == "extended" ]]; then
            npx playwright test \
              tests/travelWorkspace.spec.js \
              tests/guideTodoIsolation.spec.js \
              tests/offlineCache.spec.js \
              tests/formalLuggageSync.spec.js \
              tests/phase-1-7f-smoke.spec.js \
              tests/formalEditorHandoff.spec.js \
              tests/expenseReadRecovery.spec.js \
              tests/formalExpenseCollaboration.spec.js \
              tests/formalPendingMembership.spec.js \
              tests/formalTripDateGuard.spec.js \
              tests/phase-6-timeline-schedule-rpc.spec.js \
              tests/phase-6-timeline-schedule-planner.spec.js \
              --workers=1 --retries=1 --reporter=list,html
          else
            core_pattern='company budget workspace remains authoritative|accommodation search, detail selection and CRUD|todo completion, filtering, linked guides|luggage CRUD and assignee packing|settlement uses native payment|and its sibling retain independent drafts|account/trip-bound offline envelopes|a newer core snapshot cannot extend|real App rejects delayed A responses|older full loads cannot roll back|late trip A callback cannot invalidate|demo timeline renders without authentication|demo new timed visit preserves|demo time edit has one unified save action|demo navigation can switch to budget and luggage|owner must confirm trip deletion|timed swap persists|schedule refusal or uncertain response|an unresolved budget snapshot does not stall|a dirty unnamed expense survives|dirty guard applies to the departing trip|clean hidden expense guards|first expense read recovers|a snapshot permission refusal|a slow, failing quote cannot delay or duplicate'
            npx playwright test \
              tests/travelWorkspace.spec.js \
              tests/guideTodoIsolation.spec.js \
              tests/offlineCache.spec.js \
              tests/formalLuggageSync.spec.js \
              tests/phase-1-7f-smoke.spec.js \
              tests/formalEditorHandoff.spec.js \
              tests/expenseReadRecovery.spec.js \
              tests/formalExpenseCollaboration.spec.js \
              --grep "$core_pattern" \
              --workers=1 --retries=1 --reporter=list,html
          fi
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: travel-studio-qa-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            ${{ runner.temp }}/vite.log
          if-no-files-found: ignore
          retention-days: 7
